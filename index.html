<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Import Excel</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 30px auto; padding: 0 16px; }
    button { padding: 8px 16px; margin-right: 8px; cursor: pointer; }
    input[type=password] { padding: 8px; }
    button:focus-visible, input:focus-visible { outline: 2px solid #0b57d0; outline-offset: 2px; }

    .tabs { display: flex; gap: 4px; margin: 20px 0 16px; border-bottom: 2px solid #ddd; }
    .tab { margin: 0 0 -2px; padding: 10px 18px; border: none; border-bottom: 3px solid transparent;
           background: none; font: inherit; color: #444; }
    .tab[aria-selected="true"] { border-bottom-color: #0b57d0; color: #000; font-weight: 600; }

    .hint { margin: 0 0 12px; color: #555; font-size: 14px; }
    .msg { margin-top: 12px; font-weight: 600; min-height: 1.4em; }
    .msg.err { color: #b3261e; }
    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; margin-top: 16px; }
    th, td { border: 1px solid #ccc; padding: 6px 10px; text-align: left; }
    th { background: #f3f3f3; }
  </style>
</head>
<body>
  <h2>Import dữ liệu từ Excel</h2>

  <input type="password" id="passcode" placeholder="Passcode" autocomplete="off">

  <div class="tabs" id="tabs" role="tablist"></div>
  <div id="panels"></div>

  <script>
    const API_BASE = 'https://api.orderpermillion.trade';

    // Mỗi tab = 1 endpoint API + danh sách cột bắt buộc trong file Excel.
    // Muốn thêm tab mới: thêm 1 dòng ở đây (và khai báo tương ứng trong server.js).
    const TABS = [
      {
        id: 'nhanvien', title: 'Nhân viên', endpoint: '/api/import',
        columns: ['MaNV', 'HoTen', 'PhongBan'],
        guide: {
          MaNV:     { required: true, note: 'Mã nhân viên, tối đa 50 ký tự', example: 'NV001' },
          HoTen:    { note: 'Họ tên, tối đa 200 ký tự', example: 'Nguyen Van A' },
          PhongBan: { note: 'Phòng ban, tối đa 100 ký tự', example: 'IT' }
        }
      },
      {
        id: 'UniCode', title: 'UniCode', endpoint: '/api/UniCode',
        columns: ['ItemCode', 'ItemName', 'Unit', 'BaseRatio', 'ConversionRatio', 'ConversionUnit', 'PercentageLoss', 'BOM', 'SemiFinishedProduct', 'StandardIssue'],
        // Tên cột hiển thị cho người dùng (header file Excel). API và SQL vẫn dùng tên trong 'columns'.
        labels: {
          ItemCode: 'Mã vật tư', ItemName: 'Tên vật tư', Unit: 'Đvt',
          BaseRatio: 'Tỷ lệ gốc', ConversionRatio: 'Tỷ lệ chuyển đổi', ConversionUnit: 'Đơn vị chuyển đổi',
          PercentageLoss: '% Hao hụt', BOM: 'BOM', SemiFinishedProduct: 'BTP', StandardIssue: 'Xuất Định Mức'
        },
        guide: {
          ItemCode:            { required: true, note: 'Mã vật tư, tối đa 20 ký tự. Mã có số 0 ở đầu: đặt cả cột là Text trước khi nhập', example: '12600002' },
          ItemName:            { note: 'Tên vật tư, tối đa 255 ký tự', example: 'Eel Japan (3pcs/kg)/Unagi/Lươn Nhật 3 con' },
          Unit:                { note: 'Đơn vị tính, tối đa 20 ký tự', example: 'kg' },
          BaseRatio:           { note: 'Số, tối đa 4 chữ số thập phân', example: 1000 },
          ConversionRatio:     { note: 'Số, tối đa 4 chữ số thập phân', example: 850 },
          ConversionUnit:      { note: 'Đơn vị quy đổi, tối đa 20 ký tự', example: 'Gs' },
          PercentageLoss:      { note: 'Số nhỏ hơn 1000, tối đa 2 chữ số thập phân (phần dư bị làm tròn)', example: 0.85 },
          BOM:                 { note: 'Tối đa 20 ký tự', example: 0 },
          SemiFinishedProduct: { note: 'Tối đa 20 ký tự', example: 0 },
          StandardIssue:       { note: 'Tối đa 20 ký tự', example: 0 }
        }
      },
      {
        id: 'BOM', title: 'BOM', endpoint: '/api/BOM',
        columns: ['ItemCode', 'ItemName', 'Unit', 'Price', 'SemiFinishedProductCode', 'Quantity'],
        labels: {
          ItemCode: 'Mã Món', ItemName: 'Tên Món', Unit: 'ĐVT',
          Price: 'Giá bán', SemiFinishedProductCode: 'Mã NVL', Quantity: 'Số lượng'
        },
        guide: {
          ItemCode:                { required: true, note: 'Mã món, tối đa 20 ký tự. Mã có số 0 ở đầu: đặt cả cột là Text trước khi nhập', example: 'M001' },
          ItemName:                { note: 'Tên món, tối đa 255 ký tự', example: 'Cơm cuộn cá hồi' },
          Unit:                    { required: true, note: 'Đơn vị tính, tối đa 20 ký tự', example: 'Phần' },
          Price:                   { note: 'Giá bán, số, tối đa 2 chữ số thập phân', example: 89000 },
          SemiFinishedProductCode: { required: true, note: 'Mã nguyên vật liệu, tối đa 20 ký tự. Mã có số 0 ở đầu: đặt cả cột là Text trước khi nhập', example: '21000001' },
          Quantity:                { required: true, note: 'Số lượng, số, tối đa 4 chữ số thập phân', example: 0.15 }
        }
      }
    ];

    const $ = id => document.getElementById(id);
    const tabButtons = {};
    const panels = {};

    // Tên hiển thị của cột. Tab không khai báo 'labels' thì dùng luôn tên cột.
    const labelOf = (cfg, col) => (cfg.labels && cfg.labels[col]) || col;
    // Chuẩn hóa tên cột trong file để so sánh: đưa Unicode về 1 dạng, gộp khoảng trắng,
    // bỏ khoảng trắng hai đầu, không phân biệt hoa/thường.
    const norm = s => String(s).normalize('NFC').replace(/\s+/g, ' ').trim().toLowerCase();

    // Sinh file mẫu ngay trên trình duyệt từ cấu hình của tab.
    // Sheet 1 'Data' chỉ có dòng header (không có dữ liệu mẫu để tránh import nhầm).
    // Sheet 2 'Hướng dẫn' mô tả từng cột. Trang chỉ đọc sheet đầu tiên khi import.
    function downloadTemplate(cfg) {
      const wb = XLSX.utils.book_new();

      const head = cfg.columns.map(c => labelOf(cfg, c));
      const data = XLSX.utils.aoa_to_sheet([head]);
      data['!cols'] = head.map(h => ({ wch: Math.max(h.length + 4, 14) }));
      XLSX.utils.book_append_sheet(wb, data, 'Data');

      const g = cfg.guide || {};
      const rows = [['Cột', 'Bắt buộc', 'Ghi chú', 'Ví dụ']];
      cfg.columns.forEach(c => {
        const i = g[c] || {};
        rows.push([labelOf(cfg, c), i.required ? 'Có' : 'Không', i.note || '', i.example ?? '']);
      });
      rows.push([], ['Chỉ sheet "Data" (sheet đầu tiên) được import. Không đổi tên cột ở dòng 1.']);
      const guide = XLSX.utils.aoa_to_sheet(rows);
      guide['!cols'] = [{ wch: 24 }, { wch: 12 }, { wch: 70 }, { wch: 42 }];
      XLSX.utils.book_append_sheet(wb, guide, 'Hướng dẫn');

      XLSX.writeFile(wb, 'Template_' + cfg.id + '.xlsx');
    }

    function createPanel(cfg) {
      const panel = document.createElement('section');
      panel.setAttribute('role', 'tabpanel');
      panel.hidden = true;
      panel.innerHTML = `
        <p class="hint">Dòng 1 của file Excel phải có các cột: <b>${cfg.columns.map(c => labelOf(cfg, c)).join(', ')}</b> (nên dùng file mẫu tải từ trang). Chỉ đọc sheet đầu tiên.</p>
        <input type="file" accept=".xlsx,.xls" hidden>
        <button class="tpl">Tải file mẫu</button>
        <button class="choose">Chọn file Excel</button>
        <button class="import" disabled>Import</button>
        <span class="fname"></span>
        <div class="msg" role="status"></div>
        <div class="table-wrap"></div>`;

      const q = s => panel.querySelector(s);
      let rows = [];

      const msg = (text, isErr) => {
        q('.msg').textContent = text;
        q('.msg').className = 'msg' + (isErr ? ' err' : '');
      };

      function render() {
        const box = q('.table-wrap');
        box.innerHTML = '';
        if (!rows.length) return;
        const cols = Object.keys(rows[0]);
        const t = document.createElement('table');
        const head = t.insertRow();
        cols.forEach(c => { const th = document.createElement('th'); th.textContent = labelOf(cfg, c); head.appendChild(th); });
        rows.forEach(r => {
          const tr = t.insertRow();
          cols.forEach(c => { tr.insertCell().textContent = r[c]; });
        });
        box.appendChild(t);
      }

      q('.tpl').onclick = () => downloadTemplate(cfg);
      q('.choose').onclick = () => q('input[type=file]').click();

      q('input[type=file]').onchange = async (e) => {
        const f = e.target.files[0];
        if (!f) return;
        q('.fname').textContent = f.name;
        try {
          const wb = XLSX.read(await f.arrayBuffer());
          // Tên cột trong file (tiếng Việt hoặc tên gốc) được đổi về tên kỹ thuật để gửi lên API.
          // So sánh không phân biệt hoa/thường và bỏ khoảng trắng thừa (ô header có định dạng
          // số/tiền tệ sẽ bị SheetJS đọc thành ' BOM ' thay vì 'BOM').
          const lookup = {};
          cfg.columns.forEach(c => { lookup[norm(c)] = c; lookup[norm(labelOf(cfg, c))] = c; });
          rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' })
            .map(r => Object.fromEntries(Object.entries(r).map(([k, v]) => [lookup[norm(k)] || String(k).trim(), v])));
        } catch (err) {
          rows = [];
        }
        render();

        const missing = rows.length ? cfg.columns.filter(c => !(c in rows[0])) : [];
        if (!rows.length) msg('Không đọc được dữ liệu ở sheet đầu tiên của file.', true);
        else if (missing.length) msg('File thiếu cột: ' + missing.map(c => labelOf(cfg, c)).join(', ') + '. Sửa header dòng 1 rồi chọn lại file.', true);
        else msg(`Đã đọc ${rows.length} dòng. Kiểm tra lại rồi bấm Import.`);

        q('.import').disabled = !rows.length || missing.length > 0;
        e.target.value = '';   // cho phép chọn lại đúng file này sau khi sửa
      };

      q('.import').onclick = async () => {
        const btn = q('.import');
        btn.disabled = true;
        msg('Đang import...');
        try {
          const res = await fetch(API_BASE + cfg.endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-passcode': $('passcode').value },
            body: JSON.stringify({ rows })
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || 'Lỗi máy chủ (' + res.status + ')');
          msg(`Import thành công ${data.inserted} dòng.`);   // nút Import giữ tắt để tránh import trùng
        } catch (err) {
          const network = err instanceof TypeError;
          msg('Lỗi: ' + (network ? 'không kết nối được API (kiểm tra API, tunnel, CORS).' : err.message), true);
          btn.disabled = false;
        }
      };

      return panel;
    }

    function selectTab(id) {
      TABS.forEach(t => {
        const on = t.id === id;
        tabButtons[t.id].setAttribute('aria-selected', on);
        panels[t.id].hidden = !on;
      });
      history.replaceState(null, '', '#' + id);
    }

    TABS.forEach(cfg => {
      const b = document.createElement('button');
      b.className = 'tab';
      b.setAttribute('role', 'tab');
      b.textContent = cfg.title;
      b.onclick = () => selectTab(cfg.id);
      $('tabs').appendChild(b);
      tabButtons[cfg.id] = b;

      panels[cfg.id] = createPanel(cfg);
      $('panels').appendChild(panels[cfg.id]);
    });

    const fromHash = location.hash.slice(1);
    selectTab(TABS.some(t => t.id === fromHash) ? fromHash : TABS[0].id);
  </script>
</body>
</html>
